<html lang="el">

<body>
<title>Πρόγραμμα Βαρδιών</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: roster board. Header with week switcher, tabs, one wide grid (employees × days) that scrolls inside its own box. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#15212a; --muted:#5a6b77; --line:#d6dee4;
  --accent:#0d5a6b; --accent-ink:#ffffff; --accent-soft:#dcecef;
  --m-bg:#fcefcf; --m-fg:#6e4a00; --e-bg:#e0e4fb; --e-fg:#2c3788;
  --f-bg:#d3efe1; --f-fg:#0f5535; --s-bg:#f5e0ee; --s-fg:#7a2361; --o-bg:#f1f3f5; --o-fg:#6d7b86; --o-hatch:#e1e6ea;
  --warn:#b23a1e; --warn-soft:#fbe4dc;
  --font-ui:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --surface:#172129; --ink:#e5ecf1; --muted:#92a2ae; --line:#283541;
  --accent:#5fc3d6; --accent-ink:#0b1a1f; --accent-soft:#16343c;
  --m-bg:#3a2e12; --m-fg:#f4cf7c; --e-bg:#232a52; --e-fg:#bcc4ff;
  --f-bg:#143a2a; --f-fg:#8fe2b9; --s-bg:#3b1a32; --s-fg:#f1a8d7; --o-bg:#1a242c; --o-fg:#7f8f9b; --o-hatch:#202c35;
  --warn:#ff8c71; --warn-soft:#3d1f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#172129; --ink:#e5ecf1; --muted:#92a2ae; --line:#283541;
  --accent:#5fc3d6; --accent-ink:#0b1a1f; --accent-soft:#16343c;
  --m-bg:#3a2e12; --m-fg:#f4cf7c; --e-bg:#232a52; --e-fg:#bcc4ff;
  --f-bg:#143a2a; --f-fg:#8fe2b9; --s-bg:#3b1a32; --s-fg:#f1a8d7; --o-bg:#1a242c; --o-fg:#7f8f9b; --o-hatch:#202c35;
  --warn:#ff8c71; --warn-soft:#3d1f17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1{margin:0;font-size:1.65rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.weeknav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.weeknav .lbl{min-width:0;padding:0 8px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.weeknav .lbl small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
.iconbtn{width:36px;height:36px;border-radius:999px;border:0;background:transparent;font-size:1.1rem;display:grid;place-items:center}
.iconbtn:hover{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--font-num);font-size:.75rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;margin-left:6px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.small{padding:6px 10px;font-size:.85rem}
.note{color:var(--muted);font-size:.88rem;max-width:68ch}
.alert{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.alert strong{color:var(--warn)}
.info{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--muted)}
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:860px}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
thead th .date{display:block;font-family:var(--font-num);text-transform:none;letter-spacing:0;color:var(--ink);font-size:.82rem}
th.emp,td.emp{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;border-right:1px solid var(--line)}
td.emp .n{font-weight:600}
td.emp .meta{font-size:.76rem;color:var(--muted);font-family:var(--font-num)}
td.tot{font-family:var(--font-num);font-size:.82rem;white-space:nowrap;color:var(--muted);text-align:right}
td.tot b{color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:0}
.cell{position:relative;border-radius:8px;padding:7px 8px;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.cell .t{font-weight:600;font-size:.88rem}
.cell .h{font-family:var(--font-num);font-size:.72rem;opacity:.85}
.cell .tag{position:absolute;top:4px;right:6px;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;opacity:.8}
.cell select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cell:has(select:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.c-M{background:var(--m-bg);color:var(--m-fg)}
.c-E{background:var(--e-bg);color:var(--e-fg)}
.c-F{background:var(--f-bg);color:var(--f-fg)}
.c-S{background:var(--s-bg);color:var(--s-fg)}
.c-O{color:var(--o-fg);background:repeating-linear-gradient(-45deg,var(--o-bg) 0 6px,var(--o-hatch) 6px 12px)}
.c-X{border:1px dashed var(--line);color:var(--muted)}
tfoot td{font-family:var(--font-num);font-size:.8rem;color:var(--muted);background:var(--bg)}
tfoot td.emp{background:var(--bg);font-family:var(--font-ui);font-weight:600;color:var(--ink)}
.cov{display:flex;gap:6px;flex-wrap:wrap}
.cov span{padding:1px 6px;border-radius:5px}
.cov .ok{background:var(--surface)}
.cov .low{background:var(--warn-soft);color:var(--warn);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.empty h2{margin:0;font-size:1.15rem}
.req{width:100%;min-height:44px;border-radius:8px;border:1px dashed var(--line);background:transparent;font-weight:600;font-size:.85rem;color:var(--muted)}
.req:hover{border-color:var(--accent);color:var(--ink)}
.req[aria-pressed="true"]{border-style:solid;border-color:transparent;color:var(--o-fg);background:repeating-linear-gradient(-45deg,var(--o-bg) 0 6px,var(--o-hatch) 6px 12px);box-shadow:inset 0 0 0 2px var(--accent)}
.req[aria-pressed="true"]{color:var(--ink)}
.over{color:var(--warn);font-weight:600}
.emps{display:flex;flex-direction:column;gap:10px}
.emprow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(3,minmax(110px,1fr)) auto;gap:10px;align-items:end}
.emprow .ex{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-4px}
.emprow .checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.85rem}
.checks .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.checks .gl{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-right:2px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;background:var(--bg)}
.chk input{width:auto;margin:0;accent-color:var(--accent)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.badge{font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 5px;background:var(--accent-soft);color:var(--accent);margin-left:4px;vertical-align:1px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:500}
input:focus,select:focus{border-color:var(--accent);outline:none}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table.needs{min-width:560px}
table.needs input{text-align:center;font-family:var(--font-num);padding:7px 4px}
table.needs th.emp,table.needs td.emp{min-width:110px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:600;font-size:.82rem}
h3.sect{margin:10px 0 0;font-size:1.02rem}
.card .gridbox{border-radius:8px}
footer{color:var(--muted);font-size:.8rem;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--f-fg)}
textarea{width:100%;min-height:220px;font-family:var(--font-num);font-size:.8rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:10}
@media (max-width:760px){
  .emprow{grid-template-columns:1fr 1fr}
  .emprow .nm{grid-column:1/-1}
  th.emp,td.emp{min-width:0;width:122px}
  td.emp .meta{font-size:.7rem}
  .badge{font-size:.56rem;padding:1px 4px}
  table{min-width:800px}
  h1{font-size:1.35rem}
}
@media (prefers-reduced-motion:no-preference){.btn,.req,.iconbtn{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Πρόγραμμα Βαρδιών</h1>
      <div class="sub" id="hours">Ωράριο μαγαζιού 06:00–20:30, κάθε μέρα</div>
    </div>
    <div class="weeknav" role="group" aria-label="Εβδομάδα">
      <button class="iconbtn" id="prevWeek" aria-label="Προηγούμενη εβδομάδα">‹</button>
      <div class="lbl" id="weekLabel">…</div>
      <button class="iconbtn" id="nextWeek" aria-label="Επόμενη εβδομάδα">›</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="schedule">Πρόγραμμα</button>
    <button role="tab" data-tab="requests">Ρεπό εβδομάδας<span class="count" id="reqCount">0</span></button>
    <button role="tab" data-tab="employees">Εργαζόμενοι<span class="count" id="empCount">0</span></button>
    <button role="tab" data-tab="settings">Ρυθμίσεις</button>
  </nav>
  <main id="main"><div class="info">Φόρτωση…</div></main>
  <footer><span class="dot" id="dot"></span><span id="storeNote">Σύνδεση με την αποθήκευση…</span></footer>
</div>

<script>
const DAYS=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];
const DAYS_S=['Δευ','Τρι','Τετ','Πεμ','Παρ','Σαβ','Κυρ'];
const MONTHS=['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const LABEL={M:'Πρωί',E:'Απόγευμα',F:'Ολοήμερο',S:'Σπαστό',O:'Ρεπό'};
const SLOTS=6;
const DEFAULT_SETTINGS={
  open:'06:00',close:'20:30',fullStart:'06:00',fullEnd:'20:30',
  split1Start:'06:00',split1End:'10:00',split2Start:'16:30',split2End:'20:30',
  morningStarts:['06:00','06:00','07:30','09:00','09:00','09:00'],
  eveningEnds:['20:30','20:30','20:30','20:30','20:30','20:30'],
  needs:null,
};
function defaultNeeds(m,e){return Array.from({length:7},()=>({m,e}))}
function normSettings(s){
  s={...DEFAULT_SETTINGS,...(s||{})};
  const nd=Array.isArray(s.needs)&&s.needs.length===7?s.needs:defaultNeeds(+s.minMorning||2,+s.minEvening||2);
  s.needs=nd.map(n=>({m:clampInt(n&&n.m,0,20,2),e:clampInt(n&&n.e,0,20,2)}));
  const fill=(a,def)=>Array.from({length:SLOTS},(_,i)=>(Array.isArray(a)&&a[i])||def[i]);
  s.morningStarts=fill(s.morningStarts,DEFAULT_SETTINGS.morningStarts);
  s.eveningEnds=fill(s.eveningEnds,DEFAULT_SETTINGS.eveningEnds);
  delete s.minMorning;delete s.minEvening;
  return s;
}
function normEmp(e){
  e={...e};
  if(!e.can){e.can={M:e.pref!=='evening',E:e.pref!=='morning',S:false}}
  e.can={M:!!e.can.M,E:!!e.can.E,S:!!e.can.S};
  e.keys=!!e.keys;e.till=!!e.till;
  delete e.pref;
  return e;
}

let config={settings:normSettings(null),employees:[]};
let configLoaded=false;
let weekId=ymd(mondayOf(addDays(new Date(),7)));
let week=emptyWeek();
let weekLoaded=false;
let tab='schedule';
let backend=null, unsubWeek=null, readOnly=false;
let armed=null; // id of a button waiting for a second click
let copyText=null;

try{const t=localStorage.getItem('sched:tab'); if(t) tab=t;}catch(e){}

/* ---------- helpers ---------- */
function emptyWeek(){return {requests:{},schedule:null,reqKey:null,edited:false}}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function toMin(t){const [h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)}
function fmt(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return 'e'+Math.random().toString(36).slice(2,9)}
function hrs(m){const h=m/60;return (Math.round(h*10)/10).toString().replace('.',',')}
function dayDate(i){return addDays(parseYmd(weekId),i)}
function emps(){return config.employees||[]}
function offTarget(e){return 7-clampInt(e.days,1,7,5)}
function clampInt(v,lo,hi,def){v=parseInt(v,10);if(isNaN(v))return def;return Math.min(hi,Math.max(lo,v))}
function reqDays(id){return (week.requests&&week.requests[id])||[]}
function totalRequests(){return emps().reduce((s,e)=>s+reqDays(e.id).length,0)}
function reqKeyNow(){return JSON.stringify({r:emps().map(e=>[e.id,reqDays(e.id).slice().sort(),e.days,e.fullDays,e.hours,e.can,e.keys,e.till]),s:config.settings,n:weekNeeds()})}
/* People needed per day: this week's override if set, otherwise the weekday default from settings. */
function weekNeeds(){return [0,1,2,3,4,5,6].map(d=>(week.needs&&week.needs[d])||config.settings.needs[d])}
function hasWeekOverride(){return Array.isArray(week.needs)&&week.needs.length===7}
const isMorning=c=>c==='M'||c==='F'||c==='S';
const isEvening=c=>c==='E'||c==='F'||c==='S';
function workCodes(e){const c=['M','E','S'].filter(k=>e.can&&e.can[k]);return c.length?c:['M']}

/* Exact hours of every person on day d. Morning people get the start times in order
   (key holders first so the shop opens), evening people the end times (till people last out). */
function dayTimes(sched,d){
  const s=config.settings,open=toMin(s.open),close=toMin(s.close),out={};
  const list=emps().filter(e=>sched&&sched[e.id]);
  const code=e=>sched[e.id][d];
  const rot=e=>(list.indexOf(e)+d*2)%Math.max(1,list.length);
  list.forEach(e=>{
    const c=code(e);
    if(c==='F')out[e.id]=[[toMin(s.fullStart),toMin(s.fullEnd)]];
    if(c==='S')out[e.id]=[[toMin(s.split1Start),toMin(s.split1End)],[toMin(s.split2Start),toMin(s.split2End)]];
  });
  const fixed=list.filter(e=>code(e)==='F'||code(e)==='S');
  const hasOpener=fixed.some(e=>e.keys),hasCloser=fixed.some(e=>e.till);
  const starts=s.morningStarts.map(toMin).sort((a,b)=>a-b);
  const ends=s.eveningEnds.map(toMin).sort((a,b)=>b-a);
  const ms=list.filter(e=>code(e)==='M').sort((a,b)=>(b.keys-a.keys)||(rot(a)-rot(b)));
  ms.forEach((e,i)=>{
    let st=starts[Math.min(fixed.length+i,starts.length-1)];
    if(i===0&&e.keys&&!hasOpener)st=open;
    const h=Math.round((+e.hours||8)*60);
    out[e.id]=[[st,Math.min(close,st+h)]];
  });
  const es=list.filter(e=>code(e)==='E').sort((a,b)=>(b.till-a.till)||(rot(a)-rot(b)));
  es.forEach((e,i)=>{
    let en=ends[Math.min(fixed.length+i,ends.length-1)];
    if(i===0&&e.till&&!hasCloser)en=close;
    const h=Math.round((+e.hours||8)*60);
    out[e.id]=[[Math.max(open,en-h),en]];
  });
  return out;
}
function spanText(segs){return segs.map(x=>fmt(x[0])+'–'+fmt(x[1])).join(' & ')}
function segMins(segs){return segs.reduce((t,x)=>t+(x[1]-x[0]),0)}

function weekLabel(){
  const a=parseYmd(weekId),b=addDays(a,6);
  const left=a.getMonth()===b.getMonth()?a.getDate():a.getDate()+' '+MONTHS[a.getMonth()];
  return left+' – '+b.getDate()+' '+MONTHS[b.getMonth()]+' '+b.getFullYear();
}
function relWeek(){
  const diff=Math.round((parseYmd(weekId)-mondayOf(new Date()))/(7*864e5));
  return diff===0?'Αυτή η εβδομάδα':diff===1?'Επόμενη εβδομάδα':diff===-1?'Προηγούμενη εβδομάδα':diff>0?'Σε '+diff+' εβδομάδες':'Πριν '+(-diff)+' εβδομάδες';
}

/* ---------- schedule generator ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function generate(list,requests,needs,prev,seed){
  const rnd=mulberry32(seed);
  const n=list.length; if(!n)return {};
  const anyKeys=list.some(e=>e.keys),anyTill=list.some(e=>e.till);
  const reqSets=list.map(e=>new Set((requests[e.id]||[]).map(Number)));
  const free=list.map((e,i)=>[0,1,2,3,4,5,6].filter(d=>!reqSets[i].has(d)));
  const codes=list.map(workCodes);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const pick=i=>{const c=codes[i];const base=c.filter(k=>k!=='S');if(base.length&&(c.length===base.length||rnd()<.8))return base[Math.floor(rnd()*base.length)];return c[Math.floor(rnd()*c.length)]};

  function randomSol(){
    return list.map((e,i)=>{
      const row=Array(7).fill('O');
      const work=Math.min(clampInt(e.days,1,7,5),free[i].length);
      const days=shuffle(free[i].slice()).slice(0,work);
      const full=Math.min(clampInt(e.fullDays,0,7,0),work);
      days.forEach((d,k)=>{row[d]=k<full?'F':pick(i)});
      return row;
    });
  }
  function score(sol){
    let p=0;const mc=[],ec=[];
    for(let d=0;d<7;d++){
      let m=0,ev=0,f=0,open=false,close=false;
      for(let i=0;i<n;i++){
        const c=sol[i][d];
        if(isMorning(c)){m++;if(list[i].keys)open=true}
        if(isEvening(c)){ev++;if(list[i].till)close=true}
        if(c==='F')f++;
      }
      const nm=needs[d].m,ne=needs[d].e;
      p+=Math.max(0,nm-m)*100+Math.max(0,ne-ev)*100+f*f*.6;
      if(anyKeys&&!open)p+=600;
      if(anyTill&&!close)p+=600;
      mc.push(m-nm);ec.push(ev-ne);
    }
    const var_=a=>{const avg=a.reduce((x,y)=>x+y,0)/a.length;return a.reduce((s,x)=>s+(x-avg)*(x-avg),0)};
    p+=var_(mc)*2+var_(ec)*2;
    for(let i=0;i<n;i++){
      const row=sol[i],pr=prev&&prev[list[i].id];
      let run=0,maxRun=0;
      for(let d=0;d<7;d++){
        const c=row[d];
        if(c==='S')p+=4; // split only when it helps
        if(pr&&pr[d]===c)p+=1.5; // keep weeks different from the previous one
        if(c==='F'&&d>0&&row[d-1]==='F')p+=2;
        if(c!=='O'){run++;maxRun=Math.max(maxRun,run)}else run=0;
      }
      if(maxRun>5)p+=(maxRun-5)*3;
    }
    return p;
  }
  function mutate(sol){
    const s=sol.map(r=>r.slice());
    const i=Math.floor(rnd()*n),fr=free[i];
    if(rnd()<.55&&fr.length>1){
      const a=fr[Math.floor(rnd()*fr.length)],b=fr[Math.floor(rnd()*fr.length)];
      [s[i][a],s[i][b]]=[s[i][b],s[i][a]];
    }else{
      const d=Math.floor(rnd()*7),c=s[i][d];
      if(c!=='O'&&c!=='F'){const opts=codes[i].filter(k=>k!==c);if(opts.length)s[i][d]=opts[Math.floor(rnd()*opts.length)]}
    }
    return s;
  }
  let best=null,bestS=Infinity;
  for(let r=0;r<36;r++){
    let cur=randomSol(),cs=score(cur);
    for(let it=0;it<900;it++){const c=mutate(cur),sc=score(c);if(sc<=cs){cur=c;cs=sc}}
    if(cs<bestS){best=cur;bestS=cs}
  }
  const out={};list.forEach((e,i)=>out[e.id]=best[i]);
  return out;
}

/* ---------- storage ---------- */
function localBackend(){
  const get=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
  const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return Promise.resolve()};
  return {
    mode:'local',
    subscribeConfig(cb){setTimeout(()=>cb(get('sched:config')),0);return()=>{}},
    subscribeWeek(id,cb){setTimeout(()=>cb(get('sched:week:'+id)),0);return()=>{}},
    saveConfig:o=>put('sched:config',o),
    saveWeek:(id,o)=>put('sched:week:'+id,o),
    getWeek:id=>Promise.resolve(get('sched:week:'+id)),
  };
}
function dbBackend(db){
  const onErr=e=>{if(e&&e.code==='revoked'){readOnly=true;render()}};
  return {
    mode:'db',
    subscribeConfig(cb){return db.doc('shop/config').onSnapshot(s=>cb(s.exists?clone(s.data()):null),onErr)},
    subscribeWeek(id,cb){return db.doc('weeks/'+id).onSnapshot(s=>cb(s.exists?clone(s.data()):null),onErr)},
    saveConfig:o=>db.doc('shop/config').set(o),
    saveWeek:(id,o)=>db.doc('weeks/'+id).set(o),
    getWeek:id=>db.doc('weeks/'+id).get().then(s=>s.exists?clone(s.data()):null),
  };
}
let cfgChain=Promise.resolve(),weekChain=Promise.resolve();
function onWriteErr(e){
  if(e&&(e.code==='invalid_argument'||e.code==='not_granted')){readOnly=true;render();toast('Δεν έχεις δικαίωμα να κάνεις αλλαγές εδώ')}
  else toast('Η αποθήκευση απέτυχε. Δοκίμασε ξανά.');
}
function saveConfig(){const o=clone(config);cfgChain=cfgChain.then(()=>backend.saveConfig(o)).catch(onWriteErr)}
function saveWeek(){const o=clone(week),id=weekId;weekChain=weekChain.then(()=>backend.saveWeek(id,o)).catch(onWriteErr)}

function watchWeek(){
  if(unsubWeek)unsubWeek();
  weekLoaded=false;week=emptyWeek();render();
  const id=weekId;
  unsubWeek=backend.subscribeWeek(id,data=>{
    if(id!==weekId)return;
    const next=Object.assign(emptyWeek(),data||{});
    if(weekLoaded&&JSON.stringify(next)===JSON.stringify(week))return;
    week=next;weekLoaded=true;render();
  });
}

async function init(){
  render();
  let db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
  backend=db?dbBackend(db):localBackend();
  const dot=document.getElementById('dot'),note=document.getElementById('storeNote');
  if(db){dot.classList.add('on');note.textContent='Οι αλλαγές αποθηκεύονται αυτόματα και φαίνονται σε όποιον ανοίγει τη σελίδα.'}
  else{
    note.textContent='Τα δεδομένα αποθηκεύονται σε αυτή τη συσκευή. Κράτα αντίγραφο ασφαλείας από τις Ρυθμίσεις.';
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }
  if(db){try{const u=await window.claude.use('user');if(u&&u.can){const c=await u.can('data.write');if(c===false)readOnly=true}}catch(e){}}
  backend.subscribeConfig(data=>{
    const next={settings:normSettings(data&&data.settings),employees:((data&&data.employees)||[]).map(normEmp)};
    if(configLoaded&&JSON.stringify(next)===JSON.stringify(config))return;
    config=next;configLoaded=true;render();
  });
  watchWeek();
}

/* ---------- rendering ---------- */
function render(){
  document.getElementById('weekLabel').innerHTML='<small>'+esc(relWeek())+'</small>'+esc(weekLabel());
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  document.getElementById('reqCount').textContent=totalRequests();
  document.getElementById('empCount').textContent=emps().length;
  const s=config.settings;
  document.getElementById('hours').textContent='Ωράριο μαγαζιού '+s.open+'–'+s.close+', κάθε μέρα';
  const main=document.getElementById('main');
  if(!backend||!configLoaded){main.innerHTML='<div class="info">Φόρτωση…</div>';return}
  let html='';
  if(readOnly)html+='<div class="info">Μπορείς να δεις το πρόγραμμα, αλλά όχι να το αλλάξεις.</div>';
  if(tab==='schedule')html+=viewSchedule();
  else if(tab==='requests')html+=viewRequests();
  else if(tab==='employees')html+=viewEmployees();
  else html+=viewSettings();
  main.innerHTML='<div style="display:flex;flex-direction:column;gap:14px">'+html+'</div>';
}

      if(req.has(d))h+='<span class="tag">ζήτησε</span>';

      if(!readOnly){
        h+='<select aria-label="'+esc(e.name)+', '+DAYS[d]+'" data-cell="'+esc(e.id)+'|'+d+'">';
        ['M','E','F','S','O'].forEach(k=>{h+='<option value="'+k+'"'+(k===c?' selected':'')+'>'+LABEL[k]+'</option>'});

function metaLine(e){
  const only=e.can.M&&!e.can.E?' · μόνο πρωί':e.can.E&&!e.can.M?' · μόνο απόγευμα':'';
  return clampInt(e.days,1,7,5)+'/7 · '+String(+e.hours||8).replace('.',',')+'ωρο · '+clampInt(e.fullDays,0,7,0)+' ολοήμ.'+only+(e.can.S?' · σπαστό':'');
}
function coverage(){
  const m=Array(7).fill(0),ev=Array(7).fill(0);
  if(!week.schedule)return {m,e:ev};
  emps().forEach(e=>{const r=week.schedule[e.id];if(!r)return;for(let d=0;d<7;d++){if(isMorning(r[d]))m[d]++;if(isEvening(r[d]))ev[d]++}});
  return {m,e:ev};
}
function warnings(){
  const w=[];const nd=weekNeeds();const cov=coverage();const sched=week.schedule;const s=config.settings;
  emps().forEach(e=>{
    const r=reqDays(e.id).length,t=offTarget(e);
    if(r>t)w.push(esc(e.name)+': ζήτησε '+r+' ρεπό, ενώ τα στάνταρ του είναι '+t+'. Θα δουλέψει '+(7-r)+' μέρες.');
    if(sched&&!sched[e.id])w.push(esc(e.name)+' δεν υπάρχει στο πρόγραμμα. Βγάλε νέο πρόγραμμα για να μπει.');
  });
  if(!sched)return w;
  const low=[],noOpen=[],noClose=[];
  const anyKeys=emps().some(e=>e.keys),anyTill=emps().some(e=>e.till);
  for(let d=0;d<7;d++){
    if(cov.m[d]<nd[d].m||cov.e[d]<nd[d].e)low.push(DAYS[d]);
    const t=dayTimes(sched,d);
    const opens=emps().some(e=>e.keys&&t[e.id]&&t[e.id][0][0]<=toMin(s.open));
    const closes=emps().some(e=>e.till&&t[e.id]&&t[e.id][t[e.id].length-1][1]>=toMin(s.close));
    if(anyKeys&&!opens)noOpen.push(DAYS[d]);
    if(anyTill&&!closes)noClose.push(DAYS[d]);
  }
  if(noOpen.length)w.push('Κανείς με κλειδιά στο άνοιγμα ('+s.open+'): '+noOpen.join(', ')+'.');
  if(noClose.length)w.push('Κανείς για ταμείο στο κλείσιμο ('+s.close+'): '+noClose.join(', ')+'.');
  if(low.length)w.push('Λίγα άτομα σε κάποια βάρδια: '+low.join(', ')+'. Δες τη γραμμή «Κάλυψη» στο τέλος.');
  if(!anyKeys)w.push('Δεν έχεις σημειώσει ποιος έχει κλειδιά. Τσέκαρέ το στους Εργαζόμενους.');
  if(!anyTill)w.push('Δεν έχεις σημειώσει ποιος κλείνει ταμείο. Τσέκαρέ το στους Εργαζόμενους.');
  return w;
}

  if(!emps().length)h+=noEmployees();
  emps().forEach(e=>{
    const id=esc(e.id);
    h+='<div class="emprow">';
    h+='<label class="f nm">Όνομα<input id="n-'+id+'" data-emp="'+id+'" data-field="name" value="'+esc(e.name)+'" '+(readOnly?'disabled':'')+'></label>';
    h+='<label class="f">Μέρες / εβδομάδα<select id="d-'+id+'" data-emp="'+id+'" data-field="days" '+(readOnly?'disabled':'')+'>';

    h+='<label class="f">Ώρες βάρδιας<input id="h-'+id+'" type="number" min="2" max="12" step="0.5" inputmode="decimal" data-emp="'+id+'" data-field="hours" value="'+esc(e.hours??8)+'" '+(readOnly?'disabled':'')+'></label>';
    h+='<label class="f">Ολοήμερα / εβδ.<select id="f-'+id+'" data-emp="'+id+'" data-field="fullDays" '+(readOnly?'disabled':'')+'>';
    for(let i=0;i<=clampInt(e.days,1,7,5);i++)h+='<option value="'+i+'"'+(clampInt(e.fullDays,0,7,0)===i?' selected':'')+'>'+i+'</option>';
    h+='</select></label>';
    if(!readOnly)h+='<button class="btn small danger'+(armed==='del-'+e.id?' armed':'')+'" data-del="'+id+'">'+(armed==='del-'+e.id?'Σίγουρα;':'Διαγραφή')+'</button>';
    else h+='<span></span>';
    h+='<div class="checks"><div class="grp"><span class="gl">Μπορεί</span>'+chk(id,'canM',e.can.M,'Πρωί')+chk(id,'canE',e.can.E,'Απόγευμα')+chk(id,'canS',e.can.S,'Σπαστό')+'</div>';
    h+='<div class="grp"><span class="gl">Ρόλοι</span>'+chk(id,'keys',e.keys,'Κλειδιά (ανοίγει)')+chk(id,'till',e.till,'Ταμείο (κλείνει)')+'</div></div>';

    if(e.check)h+='<div class="ex"><i>Έλεγξε τις μέρες, τις ώρες και τα ολοήμερα. Τα έβαλα ενδεικτικά.</i></div>';
    h+='</div>';
  });
  h+='</div>';
  if(!readOnly&&emps().length)h+='<div class="bar"><button class="btn primary" data-act="addEmp">+ Νέος εργαζόμενος</button></div>';
  return h;
}

  h+='</div></div>';
  h+='<div class="card"><h3>Ώρες λήξης απογευματινών</h3><p class="note">Πότε φεύγουν το απόγευμα. Ο τελευταίος είναι πάντα κάποιος που κλείνει ταμείο. Ο καθένας ξεκινά τόσες ώρες πριν (π.χ. 20:30 − 8ωρο = 12:30).</p><div class="slots">';
  for(let i=0;i<SLOTS;i++)h+='<label class="f">'+(i+1)+'ο άτομο<input type="time" id="me-'+i+'" data-slot="e|'+i+'" value="'+esc(s.eveningEnds[i])+'"'+dis+'></label>';

  h+='<div class="card"><h3>Άτομα ανά βάρδια, για κάθε μέρα</h3><p class="note">Οι στάνταρ ανάγκες του μαγαζιού. Π.χ. Δευτέρα 3 πρωί και 2 απόγευμα, Σάββατο 4 πρωί και 2 απόγευμα. Ισχύουν για όλες τις εβδομάδες, εκτός αν τις αλλάξεις για μία εβδομάδα στην καρτέλα «Ρεπό εβδομάδας».</p>'+needsGrid(s.needs,'s')+'</div>';

function needsGrid(needs,scope){
  const dis=readOnly?' disabled':'';
  let h='<div class="gridbox"><table class="needs"><thead><tr><th class="emp">Βάρδια</th>';
  for(let d=0;d<7;d++)h+='<th>'+DAYS_S[d]+'</th>';
  h+='</tr></thead><tbody>';
  [['m','Πρωί','c-M'],['e','Απόγευμα','c-E']].forEach(([k,l,c])=>{
    h+='<tr><td class="emp"><span class="pill '+c+'">'+l+'</span></td>';
    for(let d=0;d<7;d++)h+='<td><input type="number" min="0" max="20" inputmode="numeric" id="need-'+scope+'-'+d+'-'+k+'" data-need="'+scope+'|'+d+'|'+k+'" value="'+needs[d][k]+'" aria-label="'+l+' '+DAYS[d]+'"'+dis+'></td>';
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------- actions ---------- */
async function doGenerate(){
  let prev=null;
  try{const p=await backend.getWeek(ymd(addDays(parseYmd(weekId),-7)));prev=p&&p.schedule}catch(e){}
  week.schedule=generate(emps(),week.requests||{},weekNeeds(),prev,(Math.random()*2**31)|0);
  week.reqKey=reqKeyNow();week.edited=false;week.generatedAt=new Date().toISOString();
  armed=null;tab='schedule';rememberTab();saveWeek();render();toast('Το πρόγραμμα βγήκε');
}
function buildText(){
  let t='Πρόγραμμα '+weekLabel()+'\n';
  for(let d=0;d<7;d++){
    const dd=dayDate(d),tm=dayTimes(week.schedule,d);
    t+='\n'+DAYS[d].toUpperCase()+' '+dd.getDate()+'/'+(dd.getMonth()+1)+'\n';
    const working=emps().filter(e=>week.schedule[e.id]&&week.schedule[e.id][d]!=='O'&&tm[e.id]).sort((a,b)=>tm[a.id][0][0]-tm[b.id][0][0]);
    working.forEach(e=>{t+=e.name+': '+spanText(tm[e.id])+(week.schedule[e.id][d]==='F'?' (ολοήμερο)':week.schedule[e.id][d]==='S'?' (σπαστό)':'')+'\n'});
    const off=emps().filter(e=>week.schedule[e.id]&&week.schedule[e.id][d]==='O').map(e=>e.name);
    if(off.length)t+='Ρεπό: '+off.join(', ')+'\n';
  }
  return t;
}
function exampleEmployees(){
  return [
    {name:'Χρήστος',days:6,hours:8,fullDays:3,can:{M:true,E:true,S:false},keys:true,till:true},
    {name:'Συνη',days:5,hours:8,fullDays:1,can:{M:true,E:true,S:true},keys:true,till:true,check:true},
    {name:'Χριστιάννα',days:5,hours:8,fullDays:0,can:{M:true,E:false,S:false},check:true},
    {name:'Γιώργος',days:6,hours:8,fullDays:1,can:{M:true,E:true,S:false},example:true},
    {name:'Ελένη',days:5,hours:8,fullDays:1,can:{M:true,E:true,S:false},example:true},
    {name:'Νίκος',days:5,hours:6,fullDays:0,can:{M:true,E:true,S:false},example:true},
  ].map(e=>normEmp({id:uid(),...e}));
}
function newEmp(){return {id:uid(),name:'',days:5,hours:8,fullDays:0,can:{M:true,E:true,S:false},keys:false,till:false}}
/* Backup for the on-device version: everything the app keeps in localStorage, as one JSON file. */
function exportBackup(){
  const data={app:'programma-vardion',v:1,savedAt:new Date().toISOString(),items:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sched:')&&k!=='sched:tab')data.items[k]=localStorage.getItem(k)}}catch(e){}
  const json=JSON.stringify(data);
  const name='programma-vardion-'+ymd(new Date())+'.json';
  const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Αντίγραφο προγράμματος'}).catch(()=>{});return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('Το αντίγραφο αποθηκεύτηκε');
}
function importBackup(f){
  if(!f)return;
  f.text().then(txt=>{
    const data=JSON.parse(txt);
    if(!data||data.app!=='programma-vardion'||!data.items)throw new Error('bad');
    Object.keys(data.items).forEach(k=>{if(k.startsWith('sched:'))localStorage.setItem(k,data.items[k])});
    toast('Η επαναφορά έγινε');setTimeout(()=>location.reload(),600);
  }).catch(()=>toast('Αυτό το αρχείο δεν είναι αντίγραφο του προγράμματος'));
}
function rememberTab(){try{localStorage.setItem('sched:tab',tab)}catch(e){}}
let toastTimer;
function toast(msg){
  let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2200);
}

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;armed=null;copyText=null;rememberTab();render()});
document.getElementById('prevWeek').addEventListener('click',()=>{weekId=ymd(addDays(parseYmd(weekId),-7));armed=null;copyText=null;if(backend)watchWeek();else render()});
document.getElementById('nextWeek').addEventListener('click',()=>{weekId=ymd(addDays(parseYmd(weekId),7));armed=null;copyText=null;if(backend)watchWeek();else render()});

const main=document.getElementById('main');
main.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const act=t.dataset.act;
  if(t.dataset.req){
    const [id,d]=t.dataset.req.split('|');const day=+d;
    const cur=new Set(reqDays(id));cur.has(day)?cur.delete(day):cur.add(day);
    week.requests={...(week.requests||{}),[id]:[...cur].sort()};saveWeek();render();return;
  }
  if(t.dataset.del){
    const id=t.dataset.del;
    if(armed!=='del-'+id){armed='del-'+id;render();return}
    config.employees=emps().filter(x=>x.id!==id);armed=null;saveConfig();render();return;
  }
  if(act==='goEmployees'){tab='employees';if(!emps().length){config.employees=[newEmp()];saveConfig()}rememberTab();render();const i=main.querySelector('input[data-field="name"]');if(i)i.focus();return}
  if(act==='goRequests'){tab='requests';rememberTab();render();return}
  if(act==='loadExample'){config.employees=exampleEmployees();saveConfig();render();return}
  if(act==='addEmp'){const n=newEmp();config.employees=[...emps(),n];saveConfig();render();const i=document.getElementById('n-'+n.id);if(i)i.focus();return}
  if(act==='generate'||act==='generateFromReq'){doGenerate();return}
  if(act==='regen'){if(week.edited&&armed!=='regen'){armed='regen';render();return}doGenerate();return}
  if(act==='resetNeeds'){delete week.needs;saveWeek();render();return}
  if(act==='clearReq'){if(armed!=='clearReq'){armed='clearReq';render();return}week.requests={};armed=null;saveWeek();render();return}
  if(act==='exportBackup'){exportBackup();return}
  if(act==='copy'){
    const text=buildText();
    const fallback=()=>{copyText=text;render();const a=document.getElementById('copyArea');if(a){a.focus();a.select()}};
    try{navigator.clipboard.writeText(text).then(()=>{copyText=null;toast('Αντιγράφηκε. Κάνε επικόλληση στο Viber ή στο WhatsApp.')},fallback)}catch(err){fallback()}
    return;
  }
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'){importBackup(t.files&&t.files[0]);return}
  if(t.dataset.cell){
    const [id,d]=t.dataset.cell.split('|');if(!t.value)return;
    const sched=clone(week.schedule||{});const row=sched[id]?sched[id].slice():Array(7).fill('O');
    row[+d]=t.value;sched[id]=row;week.schedule=sched;week.edited=true;saveWeek();render();return;
  }
  if(t.dataset.emp){
    const emp=emps().find(x=>x.id===t.dataset.emp);if(!emp)return;
    const f=t.dataset.field;
    if(f==='name')emp.name=t.value.trim();
    else if(f==='days'){emp.days=clampInt(t.value,1,7,5);emp.fullDays=Math.min(clampInt(emp.fullDays,0,7,0),emp.days)}
    else if(f==='hours'){const v=parseFloat(String(t.value).replace(',','.'));emp.hours=isNaN(v)?8:Math.min(12,Math.max(2,v))}
    else if(f==='fullDays')emp.fullDays=clampInt(t.value,0,7,0);
    else if(f==='canM'||f==='canE'||f==='canS')emp.can={...emp.can,[f.slice(3)]:t.checked};
    else if(f==='keys'||f==='till')emp[f]=t.checked;
    delete emp.example;delete emp.check;
    saveConfig();render();return;
  }
  if(t.dataset.need){
    const [scope,d,k]=t.dataset.need.split('|');const v=clampInt(t.value,0,20,0);
    if(scope==='s'){const nd=clone(config.settings.needs);nd[+d][k]=v;config.settings={...config.settings,needs:nd};saveConfig()}
    else{const nd=clone(weekNeeds());nd[+d][k]=v;week.needs=nd;saveWeek()}
    render();return;
  }
  if(t.dataset.slot){
    const [k,i]=t.dataset.slot.split('|');const key=k==='m'?'morningStarts':'eveningEnds';
    const arr=config.settings[key].slice();arr[+i]=t.value||arr[+i];
    config.settings={...config.settings,[key]:arr};saveConfig();render();return;
  }
  if(t.dataset.set){
    const k=t.dataset.set;
    config.settings={...config.settings,[k]:t.value||config.settings[k]};
    saveConfig();render();
  }
});

init();
